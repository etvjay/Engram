name: Engram External Verification Readiness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/external-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENGRAM_API_TOKEN: ${{ secrets.ENGRAM_API_TOKEN }}
      COCKROACH_MCP_CLUSTER_ID: ${{ secrets.COCKROACH_MCP_CLUSTER_ID }}
      COCKROACH_MCP_API_KEY: ${{ secrets.COCKROACH_MCP_API_KEY }}

    steps:
      - name: Check required secret presence without external calls
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            AWS_REGION
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            ENGRAM_API_TOKEN
            COCKROACH_MCP_CLUSTER_ID
            COCKROACH_MCP_API_KEY
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "External verification is not ready. Missing GitHub Actions secrets:"
            printf ' - %s\n' "${missing[@]}"
            echo "No secret values were printed and no external services were contacted."
            exit 1
          fi

          echo "External verification credential presence check passed."
          echo "No secret values were printed and no external services were contacted."
