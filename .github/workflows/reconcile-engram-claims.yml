name: Reconcile Engram Claims

on:
  push:
    branches: [maintenance/evidence-roadmap-after-exp019]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/evidence-roadmap-after-exp019
      - name: Append accepted claims ENG-032 through ENG-037
        shell: python
        env:
          CLAIMS_APPEND_B64: ""
        run: |
          import base64
          import os
          import re
          from pathlib import Path

          path = Path('evidence/claims.yaml')
          text = path.read_text()
          for claim_id in [f'ENG-{n:03d}' for n in range(32, 38)]:
              if f'id: {claim_id}' in text:
                  raise SystemExit(f'{claim_id} already exists; refusing stale append')
          if 'id: ENG-031' not in text:
              raise SystemExit('ENG-031 anchor missing; refusing append')

          addition = base64.b64decode(os.environ['CLAIMS_APPEND_B64']).decode()
          path.write_text(text.rstrip() + addition + '\n')
      - name: Validate claim sequence
        shell: python
        run: |
          import re
          from pathlib import Path
          text = Path('evidence/claims.yaml').read_text()
          ids = [int(value) for value in re.findall(r'^\s*- id: ENG-(\d{3})$', text, re.M)]
          if ids != list(range(1, 38)):
              raise SystemExit(f'claim sequence is not contiguous ENG-001..ENG-037: {ids[-10:]}')
      - name: Commit claims ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/claims.yaml
          git commit -m "docs: reconcile evidence claims through ENG-037"
          git push origin HEAD:maintenance/evidence-roadmap-after-exp019
