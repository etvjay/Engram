name: Reconcile Engram Claims

on:
  push:
    branches: [maintenance/evidence-roadmap-after-exp019]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/evidence-roadmap-after-exp019
      - name: Append accepted claims ENG-032 through ENG-037
        shell: python
        run: |
          from pathlib import Path

          path = Path('evidence/claims.yaml')
          text = path.read_text()
          for claim_id in [f'ENG-{n:03d}' for n in range(32, 38)]:
              if f'id: {claim_id}' in text:
                  raise SystemExit(f'{claim_id} already exists; refusing stale append')
          if 'id: ENG-031' not in text:
              raise SystemExit('ENG-031 anchor missing; refusing append')

          addition = r'''

  - id: ENG-032
    claim: Engram fails closed when version-bound Operational Memory requires environment or tool compatibility evidence that the current execution did not supply.
    state: TESTED
    evidence:
      - packages/runtime/src/policy.ts
      - packages/runtime/src/runtime.ts
      - tests/runtime/context-completeness-memory.test.ts
      - experiments/EXP-014-context-completeness-authority/hypothesis.md
      - experiments/EXP-014-context-completeness-authority/setup.md
      - experiments/EXP-014-context-completeness-authority/findings.md
      - experiments/EXP-014-context-completeness-authority/decision.md
      - GitHub Actions Engram CI run 31943569578
    boundary: Missing comparison metadata is treated as UNKNOWN compatibility rather than compatibility. This is deterministic runtime evidence; live applications may still supply inaccurate or semantically weak version identifiers.

  - id: ENG-033
    claim: Engram requires claimed Operational Memory source-execution lineage to resolve to canonical same-agent executions before recall exposure and again before decision influence.
    state: TESTED
    evidence:
      - packages/runtime/src/runtime.ts
      - tests/runtime/provenance-authenticity-memory.test.ts
      - experiments/EXP-015-provenance-authenticity/hypothesis.md
      - experiments/EXP-015-provenance-authenticity/setup.md
      - experiments/EXP-015-provenance-authenticity/findings.md
      - experiments/EXP-015-provenance-authenticity/decision.md
      - GitHub Actions Engram CI run 31944577594
    boundary: This proves deterministic runtime reconciliation of declared lineage, not cryptographic provenance, tamper-evident storage, cross-tenant authorization or trusted attestation.

  - id: ENG-034
    claim: Engram independently revalidates same-agent Operational Memory ownership at recall and influence time even if a storage adapter returns or later mutates a foreign-agent memory.
    state: TESTED
    evidence:
      - packages/runtime/src/runtime.ts
      - tests/runtime/agent-isolation-authority.test.ts
      - experiments/EXP-016-runtime-agent-isolation-authority/hypothesis.md
      - experiments/EXP-016-runtime-agent-isolation-authority/setup.md
      - experiments/EXP-016-runtime-agent-isolation-authority/findings.md
      - experiments/EXP-016-runtime-agent-isolation-authority/decision.md
      - GitHub Actions Engram CI run 31944737562
    boundary: This is defense-in-depth for the current per-agent ownership model, not production tenant/workspace identity, RBAC, ACLs or authorized shared memory.

  - id: ENG-035
    claim: Engram prevents newly derived Operational Memory from claiming a stronger evidence state than the execution outcome that admitted it.
    state: TESTED
    evidence:
      - packages/runtime/src/policy.ts
      - packages/runtime/src/runtime.ts
      - tests/runtime/evidence-state-escalation.test.ts
      - experiments/EXP-017-evidence-state-escalation/hypothesis.md
      - experiments/EXP-017-evidence-state-escalation/setup.md
      - experiments/EXP-017-evidence-state-escalation/findings.md
      - experiments/EXP-017-evidence-state-escalation/decision.md
      - GitHub Actions Engram CI run 31944907415
    boundary: The admitting execution is an evidence ceiling for direct derived memory. Cryptographic verification, trusted attestors and conservative multi-source evidence aggregation remain separate work.

  - id: ENG-036
    claim: Engram requires CONTROL_RUN, SHADOW_RUN and REPLAY counterfactual evidence to reference an existing, distinct, completed comparison execution owned by the same agent.
    state: TESTED
    evidence:
      - packages/core/src/protocol.ts
      - packages/runtime/src/runtime.ts
      - tests/runtime/counterfactual-authenticity.test.ts
      - experiments/EXP-018-counterfactual-authenticity/hypothesis.md
      - experiments/EXP-018-counterfactual-authenticity/setup.md
      - experiments/EXP-018-counterfactual-authenticity/findings.md
      - experiments/EXP-018-counterfactual-authenticity/decision.md
      - GitHub Actions Engram CI run 31945075487
    boundary: This authenticates the referenced comparison execution but does not prove controlled-variable equivalence, side-effect isolation or causal validity of a full shadow/replay experiment.

  - id: ENG-037
    claim: Engram binds each exposed recall to a versioned digest of the authority-relevant Operational Memory state and rejects later influence if that state changed or the persisted recall has no state binding.
    state: TESTED
    evidence:
      - packages/core/src/protocol.ts
      - packages/runtime/src/memory-state.ts
      - packages/runtime/src/runtime.ts
      - packages/cockroach/src/runtime-store.ts
      - db/migrations/008_recall_memory_state_digest.sql
      - tests/runtime/recall-influence-state-integrity.test.ts
      - tests/runtime/memory-state-digest.test.ts
      - experiments/EXP-019-recall-influence-state-integrity/hypothesis.md
      - experiments/EXP-019-recall-influence-state-integrity/setup.md
      - experiments/EXP-019-recall-influence-state-integrity/findings.md
      - experiments/EXP-019-recall-influence-state-integrity/decision.md
      - GitHub Actions Engram CI run 31947548380
    boundary: The digest proves continuity of the Operational Memory object state exposed by recall; it does not prove external facts are immutable or replace provenance, ownership, lifecycle, evidence, policy or counterfactual checks. Credentialed CockroachDB Cloud execution remains separately live-verification-gated.
'''
          path.write_text(text.rstrip() + addition + '\n')
      - name: Validate claim sequence
        shell: python
        run: |
          import re
          from pathlib import Path
          text = Path('evidence/claims.yaml').read_text()
          ids = [int(value) for value in re.findall(r'^\s*- id: ENG-(\d{3})$', text, re.M)]
          if ids != list(range(1, 38)):
              raise SystemExit(f'claim sequence is not contiguous ENG-001..ENG-037: {ids[-10:]}')
      - name: Commit claims ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/claims.yaml
          git commit -m "docs: reconcile evidence claims through ENG-037"
          git push origin HEAD:maintenance/evidence-roadmap-after-exp019
