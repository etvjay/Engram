name: Engram Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      BEDROCK_EMBEDDING_MODEL: ${{ vars.BEDROCK_EMBEDDING_MODEL || 'amazon.titan-embed-text-v2:0' }}
      COCKROACH_MCP_URL: https://cockroachlabs.cloud/mcp
      COCKROACH_MCP_CLUSTER_ID: ${{ secrets.COCKROACH_MCP_CLUSTER_ID }}
      COCKROACH_MCP_API_KEY: ${{ secrets.COCKROACH_MCP_API_KEY }}
      COCKROACH_MCP_DATABASE: ${{ vars.COCKROACH_MCP_DATABASE || 'defaultdb' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY COCKROACH_MCP_CLUSTER_ID COCKROACH_MCP_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - run: npm install

      - name: Build Engram
        run: npm run build

      - name: Apply CockroachDB schema
        run: npx tsx scripts/migrate.ts

      - name: Execute live memory proof
        run: npx tsx scripts/live-verify.ts

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-live-verification-${{ github.run_id }}
          path: evidence/live/
          if-no-files-found: warn
          retention-days: 30
