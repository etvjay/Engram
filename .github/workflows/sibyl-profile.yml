name: Engram Sibyl Profile

on:
  pull_request:
  workflow_dispatch:

jobs:
  sibyl-profile:
    runs-on: ubuntu-latest
    env:
      ENGRAM_SIBYL_DB: ${{ runner.temp }}/engram-sibyl-demo.db
      ENGRAM_SIBYL_TENANT: engram-ci-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r packages/sibyl/requirements.txt
      - run: npm run build
      - run: npm run test:sibyl
      - name: Seed execution memory in process A
        run: npm run demo:sibyl:seed
      - name: Recall and change action in fresh process B
        run: npm run demo:sibyl:recall
      - name: Show no-memory control
        run: npm run demo:sibyl:no-memory-control
      - name: Remove Sibyl runtime and prove fail-closed degradation
        run: npm run test:sibyl:deletion
