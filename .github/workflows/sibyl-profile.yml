name: Engram Sibyl Profile

on:
  pull_request:
  workflow_dispatch:

jobs:
  sibyl-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r packages/sibyl/requirements.txt
      - run: npm run build
      - run: npm run test:sibyl
