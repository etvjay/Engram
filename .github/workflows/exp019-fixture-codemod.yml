name: EXP-019 Fixture Codemod

on:
  push:
    branches: [exp-019-recall-influence-state-integrity]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp-019-recall-influence-state-integrity
      - name: Upgrade recall persistence in test stores
        shell: python
        run: |
          from pathlib import Path
          import re

          method = re.compile(
              r'(async updateRecallExposure\(update: RecallExposureUpdate\) \{)(.*?)(\n  \})',
              re.S,
          )
          candidate = re.compile(r'(?m)^(\s*)memoryId(?:(\s*:\s*([^,\n]+)))?,\n')
          changed = []

          for path in Path('tests').rglob('*.ts'):
              text = path.read_text()
              match = method.search(text)
              if not match:
                  continue
              body = match.group(2)
              if 'memoryStateDigest:' in body:
                  continue

              binding = "\n    const memoryStateById = new Map(update.exposedMemoryStates.map((state) => [state.memoryId, state.memoryStateDigest]));"
              body = binding + body

              def add_digest(m):
                  indent = m.group(1)
                  assignment = m.group(2) or ''
                  expr = (m.group(3) or 'memoryId').strip()
                  return f"{indent}memoryId{assignment},\n{indent}memoryStateDigest: memoryStateById.get({expr}),\n"

              body, count = candidate.subn(add_digest, body)
              if count == 0:
                  raise RuntimeError(f'No recall candidate memoryId found inside updateRecallExposure in {path}')

              text = text[:match.start()] + match.group(1) + body + match.group(3) + text[match.end():]
              path.write_text(text)
              changed.append(str(path))

          print('Updated fixtures:')
          print('\n'.join(changed) if changed else '(none)')
      - name: Verify codemod scope
        shell: python
        run: |
          from pathlib import Path
          # The generated helper must remain local to updateRecallExposure.
          for path in Path('tests').rglob('*.ts'):
              text = path.read_text()
              if 'memoryStateById.get' not in text:
                  continue
              if 'async updateRecallExposure(update: RecallExposureUpdate)' not in text:
                  raise SystemExit(f'unexpected generated binding outside recall store: {path}')
      - name: Commit fixture upgrades
        run: |
          if git diff --quiet -- tests; then
            echo "No fixture changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          git commit -m "test: persist recall memory state bindings in fixtures"
          git push origin HEAD:exp-019-recall-influence-state-integrity
