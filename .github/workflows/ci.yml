name: Engram CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  sibyl-profile:
    runs-on: ubuntu-latest
    env:
      ENGRAM_SIBYL_DB: /tmp/engram-sibyl-demo.db
      ENGRAM_SIBYL_TENANT: engram-ci-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r packages/sibyl/requirements.txt
      - run: npm run build
      - run: npm run test:sibyl
      - name: Seed execution memory in process A
        run: npm run demo:sibyl:seed
      - name: Recall and change action in fresh process B
        run: npm run demo:sibyl:recall
      - name: Show no-memory control
        run: npm run demo:sibyl:no-memory-control
      - name: Seed accumulated provider experience in process C
        run: npm run demo:sibyl:provider:seed
      - name: Fresh urgent provider decision uses relationship memory
        run: npm run demo:sibyl:provider:urgent
      - name: Fresh routine provider decision narrows authority contextually
        run: npm run demo:sibyl:provider:routine
      - name: Remove Sibyl runtime and prove fail-closed degradation
        run: npm run test:sibyl:deletion
      - name: Smoke exact evidence capture path
        env:
          ENGRAM_EVIDENCE_DIR: /tmp/engram-sibyl-evidence-smoke
        run: npm run evidence:sibyl:capture
      - name: Verify evidence manifest exists
        run: test -s /tmp/engram-sibyl-evidence-smoke/manifest.json
