name: Engram GCP Live Proof Probe

on:
  push:
    branches: [gcp-live-proof-probe]
    paths: [.github/workflows/gcp-live-proof-probe.yml]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENGRAM_EMBEDDING_PROVIDER: vertex
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
      VERTEX_EMBEDDING_MODEL: ${{ secrets.VERTEX_EMBEDDING_MODEL || 'gemini-embedding-001' }}
      VERTEX_EMBEDDING_DIMENSIONS: '1024'
      COCKROACH_MCP_URL: https://cockroachlabs.cloud/mcp
      COCKROACH_MCP_CLUSTER_ID: ''
      COCKROACH_MCP_API_KEY: ''
      COCKROACH_MCP_DATABASE: defaultdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight non-auth configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL GOOGLE_CLOUD_PROJECT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - run: npm install
      - run: npm run build

      - name: Run Vertex + Cockroach causal-spine proof
        run: node dist/services/verification/src/live-verify.js

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-gcp-live-proof-${{ github.run_id }}
          path: evidence/live/
          if-no-files-found: warn
          retention-days: 30
