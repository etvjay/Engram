name: Sibyl Evidence Capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r packages/sibyl/requirements.txt
      - run: npm run build
      - name: Capture fresh Sibyl evidence bundle
        run: npm run evidence:sibyl:capture
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sibyl-evidence-${{ github.sha }}
          path: artifacts/sibyl-evidence/
          if-no-files-found: error
          retention-days: 30
