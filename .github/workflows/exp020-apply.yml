name: EXP-020 acceptance finalizer

on:
  push:
    branches: [exp-020-multi-source-evidence-ceiling]
    paths: [.github/workflows/exp020-apply.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp-020-multi-source-evidence-ceiling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize accepted experiment records
        run: |
          cat > experiments/EXP-020-multi-source-evidence-ceiling/findings.md <<'EOF'
          # EXP-020 — Findings

          **Status: ACCEPTED**

          ## Red evidence

          The pre-implementation adversarial run reproduced the predicted authority escalation.

          - Engram CI run: `31948342358`
          - Adversarial commit: `5a1dfacce1b59f5a116c45c4962607ca9627de17`
          - Result: **FAILURE**, as expected for the red phase.
          - An `OBSERVED` historical supporting execution plus a `VERIFIED` admitting execution was able to admit a `VERIFIED` multi-source memory before the fix.

          This proved EXP-017's admitting-execution ceiling did not cover additional declared supporting executions.

          ## Green evidence

          - EXP-020 scoped acceptance run: `31948369159`, attempt 3 — **SUCCESS**.
          - Full `npm run check` passed before the workflow was allowed to commit the runtime/Cockroach change.
          - The mixed-source escalation regression passes: `VERIFIED` over `[OBSERVED, VERIFIED]` is rejected.
          - Conservative positive control passes: `OBSERVED` over `[OBSERVED, VERIFIED]` is accepted.
          - Strong positive control passes: `VERIFIED` over `[VERIFIED, VERIFIED]` is accepted.
          - Missing persisted outcome evidence for a historical declared source fails closed.
          - Existing source deduplication, admitting-execution membership, same-agent provenance and repeated-handoff behavior remain green.
          - CockroachDB runtime storage resolves historical source evidence from the canonical `outcomes.evidence_state` record.

          ## Finding

          `sourceExecutionIds` already means executions whose evidence supports a memory. Therefore each declared source is an authority-bearing dependency, not a confidence-inflating citation. A derived multi-source memory cannot soundly claim an evidence rank stronger than any declared supporting source outcome.

          The effective evidence ceiling is consequently the minimum evidence rank across the declared supporting source outcomes. The current admitting execution remains independently bounded by EXP-017; historical sources are revalidated from persisted outcome evidence.

          ## Boundary

          This proves deterministic evidence-state authority for declared supporting sources. It does not prove that an external source deserves its evidence label, cryptographically attest outcome truth, define weighted/non-material source roles, or establish live CockroachDB Cloud behavior. Those require separate live verification and, if needed, a future explicit source-role contract.
          EOF

          cat > experiments/EXP-020-multi-source-evidence-ceiling/decision.md <<'EOF'
          # EXP-020 — Decision

          **Status: ACCEPTED**

          Accept the conservative multi-source evidence ceiling.

          Every execution named in `sourceExecutionIds` is asserted by the admission contract to supply evidence supporting the derived Operational Memory. Therefore the memory's `evidenceState` must not exceed the evidence state of any declared supporting source outcome.

          The admitting execution is already bounded by EXP-017. For additional historical sources, Engram resolves the persisted outcome evidence state and rejects admission when the requested memory evidence rank exceeds it. If a historical source outcome cannot be resolved, admission fails closed rather than manufacturing evidence authority.

          This is recorded architecturally as D-025.
          EOF

          cat >> DECISIONS.md <<'EOF'

          ## D-025 — Multi-source memory authority is bounded by every declared supporting source

          **Status:** ACCEPTED

          `sourceExecutionIds` is an evidence-support contract. Every declared source therefore contributes an upper bound to the evidence authority of a derived Operational Memory. A multi-source memory may not claim an evidence rank stronger than the weakest declared supporting source outcome.

          The admitting execution remains bounded by D/EXP-017's direct admission ceiling. Additional historical sources are revalidated against their persisted outcome evidence; an unresolved historical outcome fails closed. Adding one strong source cannot elevate a memory whose declared support still depends on weaker evidence.

          This decision does not assign weights or distinguish contextual from materially supporting sources. If Engram later needs non-material provenance citations, that requires an explicit source-role contract rather than weakening this invariant.
          EOF

          cat >> evidence/claims.yaml <<'EOF'

            - id: ENG-038
              claim: Engram prevents multi-source Operational Memory from claiming stronger evidence than the weakest outcome among its declared supporting source executions and fails closed when historical source outcome evidence cannot be resolved.
              state: TESTED
              evidence:
                - packages/runtime/src/runtime.ts
                - packages/runtime/src/store.ts
                - packages/cockroach/src/runtime-store.ts
                - tests/runtime/multi-source-admission.test.ts
                - tests/e2e/repeated-handoff-pattern-memory.test.ts
                - experiments/EXP-020-multi-source-evidence-ceiling/hypothesis.md
                - experiments/EXP-020-multi-source-evidence-ceiling/setup.md
                - experiments/EXP-020-multi-source-evidence-ceiling/findings.md
                - experiments/EXP-020-multi-source-evidence-ceiling/decision.md
                - GitHub Actions EXP-020 scoped acceptance run 31948369159 attempt 3
              boundary: The invariant governs declared supporting-source evidence authority. It does not cryptographically establish source truth, define weighted/materiality roles, or prove live CockroachDB Cloud execution.
          EOF
      - run: npm install
      - run: npm run check
      - name: Commit accepted evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DECISIONS.md evidence/claims.yaml experiments/EXP-020-multi-source-evidence-ceiling/findings.md experiments/EXP-020-multi-source-evidence-ceiling/decision.md
          git commit -m "docs: accept EXP-020 evidence ceiling invariant"
          git push origin HEAD:exp-020-multi-source-evidence-ceiling
